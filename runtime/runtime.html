<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:white}canvas{display:block;width:640px;height:640px}</style><canvas id="canvas" width="1280" height="1280"></canvas>
<script type="module">
import * as THREE from './assets/three.module.js';
const params=new URLSearchParams(location.search),dim=Number(params.get('dim')||2);
const canvas=document.getElementById('canvas'),width=1280,height=1280;
let ctx=null,renderer=null,scene=null,camera=null;
{
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setSize(width,height,false);renderer.setClearColor(0xffffff,1);
 scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);if(dim===2){camera=new THREE.OrthographicCamera(-1.2,1.2,1.2,-1.2,0.01,100);camera.up.set(0,1,0);camera.position.set(0,0,5);}else{camera=new THREE.PerspectiveCamera(40,1,0.01,100);camera.up.set(0,0,1);camera.position.set(3.2,-4.5,2.5);}camera.lookAt(0,0,0);
}
window.setupAnimation=async(code)=>{
 const factory=new Function('return ('+code+'\n)')();
 const animator=await factory({ctx,THREE,scene,camera,canvas,width,height});
 if(!animator||typeof animator.render!=='function')throw Error('Factory must return {render(t)}');
 window.animationScene=scene;window.animationCamera=camera;
 window.renderFrame=async(t)=>{
  if(ctx){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='white';ctx.fillRect(0,0,width,height);ctx.setTransform(width*.42,0,0,-height*.42,width/2,height/2);ctx.strokeStyle='black';ctx.lineWidth=12/(width*.42);ctx.lineCap='round';ctx.lineJoin='round';}
  await animator.render(t);
  if(renderer)renderer.render(scene,camera);
 };
 return true;
};
window.runtimeReady=true;
window.fitAnimationCamera=async()=>{
 const all=new THREE.Box3();
 for(let i=0;i<=12;i++){await window.renderFrame(i/12);scene.updateMatrixWorld(true);all.union(new THREE.Box3().setFromObject(scene));}
 if(all.isEmpty())throw Error('Empty scene');
 const center=all.getCenter(new THREE.Vector3()),radius=all.getSize(new THREE.Vector3()).length()/2;
 const direction=new THREE.Vector3(3.2,-4.5,2.5).normalize();
 const distance=Math.max(.5,radius)/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*1.12;
 camera.position.copy(center).addScaledVector(direction,distance);camera.lookAt(center);camera.updateProjectionMatrix();
 window.displayTarget=center.toArray();window.displayDistance=distance;
 return {center:center.toArray(),distance,bounds:{min:all.min.toArray(),max:all.max.toArray()},note:'One fixed camera fitted to 13 times; generated animation code unchanged.'};
};
</script>
